name: install

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "**.py"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi
          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}

  install:
    needs: meta
    strategy:
      matrix:
        include:
          # 每条腿都在目标平台的 runner 上构建：包内 agent 解释器与 pip 的 wheel 解析
          # 都假定宿主 = 目标（prepare_agent_runtime.py 跨平台会直接报错）。M9A 同款约束。
          - os: win
            arch: x86_64
            runner: windows-latest
            agent_platform: win-x64
          - os: win
            arch: aarch64
            runner: windows-11-arm
            agent_platform: win-arm64
          - os: macos
            arch: x86_64
            runner: macos-15-intel
            agent_platform: macos-x64
          - os: macos
            arch: aarch64
            runner: macos-latest
            agent_platform: macos-arm64
      fail-fast: false
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}*"
          latest: true
          out-file-path: "deps"
          extract: true

      - name: Resolve MFAAvalonia-MBCC release
        if: matrix.os != 'android'
        id: mfa_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 本包用的是定制 GUI（quietlysnow/MFAAvalonia-MBCC），不是上游 MaaXYZ/MFAAvalonia。
          # 该 fork 的 tag 带 "-" 时会被发成 prerelease，release-downloader 的 latest 只认
          # /releases/latest（不含 prerelease），所以这里自己挑最新的非草稿发布。
          tag=$(gh api "repos/quietlysnow/MFAAvalonia-MBCC/releases" \
            --jq '[.[] | select(.draft == false)][0].tag_name // empty')
          if [ -z "$tag" ]; then
            echo "::error::quietlysnow/MFAAvalonia-MBCC 还没有可用 release，打不出定制 GUI。"
            echo "::error::先往该仓库推一个 tag（如 v2.16.3）触发它的 Release workflow，等它发完再重跑本 workflow。"
            exit 1
          fi
          echo "MFAAvalonia-MBCC: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download MFAAvalonia
        if: matrix.os != 'android'
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: quietlysnow/MFAAvalonia-MBCC
          tag: ${{ steps.mfa_release.outputs.tag }}
          fileName: "MFAAvalonia-*-${{ (matrix.os == 'win' && 'win') || (matrix.os == 'macos' && 'osx') }}-${{ (matrix.arch == 'x86_64' && 'x64') || (matrix.arch == 'aarch64' && 'arm64') }}*"
          out-file-path: "MFA"
          extract: true

      - name: Clean up MFAAvalonia archive
        if: matrix.os != 'android'
        shell: bash
        run: |
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_mfa.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"
          echo "Archive cleanup command executed for MFAAvalonia."

      - name: Install
        shell: bash
        env:
          AGENT_RUNTIME_PLATFORM: ${{ matrix.agent_platform }}
        run: |
          # 先把 GUI 包铺进 install/，再让 install.py 覆盖资源侧文件。
          # 原来的 rsync --ignore-existing 是同一效果，但 rsync 在 Windows runner 上没有。
          if [ -d "MFA" ]; then
            echo "Copying MFA files to install directory..."
            mkdir -p install
            cp -R MFA/. install/
          else
            echo "MFA directory not found, skipping copy."
          fi

          python ./install.py ${{ needs.meta.outputs.tag }}

      - uses: actions/upload-artifact@v4
        with:
          name: MBCCtools-${{ matrix.os }}-${{ matrix.arch }}
          path: "install"

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - run: |
          cd assets
          for f in *; do
            (cd $f && zip -r ../$f-${{ needs.meta.outputs.tag }}.zip .)
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: false

      - name: Trigger MirrorChyanUploading
        if: ${{ github.repository_owner == 'quietlysnow' }}
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}